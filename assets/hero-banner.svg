<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgExec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0C0E"/>
      <stop offset="60%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#18181F"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272A"/>
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="340" rx="18" fill="url(#bgExec)" stroke="#27272A" stroke-width="2"/>
  <rect width="1200" height="340" rx="18" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="5" rx="2" fill="url(#goldAccent)"/>

  <!-- Left Column: Executive Identity -->
  <g transform="translate(56, 48)">
    <!-- Top Eyebrow -->
    <rect x="0" y="0" width="370" height="28" rx="6" fill="#1F1F26" stroke="#3F3F46" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#10B981"/>
    <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#E4E4E7" letter-spacing="1.2">EXECUTIVE ENGINEERING DOSSIER • RIYADH, KSA</text>

    <!-- Name -->
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#FAFAFA" letter-spacing="-1">DHIAA MOSTAFA</text>
    <text x="395" y="86" font-family="'Segoe UI', Tahoma, sans-serif" font-size="26" font-weight="700" fill="#F59E0B">ضياء مصطفى</text>

    <!-- Role -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600" fill="#10B981">
      Principal Back-End Engineer &amp; Multi-Tenant ERP / SaaS Architect
    </text>

    <!-- Value Proposition -->
    <text x="0" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" fill="#A1A1AA">
      6+ years architecting mission-critical Cloud ERP systems (Evix ERP), high-concurrency logistics platforms,
    </text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" fill="#A1A1AA">
      FinTech payment gateways (AlinmaPay), and AI automation across Laravel, ASP.NET Core, Node.js &amp; React.
    </text>

    <!-- Key Pillars Row -->
    <g transform="translate(0, 206)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
      <text x="80" y="21" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#F4F4F5">🏢 Cloud ERP Core</text>

      <rect x="172" y="0" width="175" height="34" rx="8" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
      <text x="259" y="21" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#F4F4F5">🛰️ Multi-Tenant SaaS</text>

      <rect x="359" y="0" width="165" height="34" rx="8" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
      <text x="441" y="21" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#F4F4F5">💳 FinTech &amp; ZATCA</text>

      <rect x="536" y="0" width="160" height="34" rx="8" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
      <text x="616" y="21" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#F4F4F5">🤖 AI &amp; Open Source</text>
    </g>
  </g>

  <!-- Right Column: 2x2 Executive Impact Grid -->
  <g transform="translate(790, 44)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="170" height="118" rx="12" fill="#18181C" stroke="#27272A" stroke-width="1.5"/>
    <text x="20" y="34" font-family="monospace" font-size="11" font-weight="700" fill="#F59E0B">01 / ERP TENANTS</text>
    <text x="20" y="76" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#FAFAFA">500+</text>
    <text x="20" y="98" font-family="-apple-system, sans-serif" font-size="12" fill="#A1A1AA">Enterprise Clients</text>

    <!-- Stat 2 -->
    <rect x="184" y="0" width="170" height="118" rx="12" fill="#18181C" stroke="#27272A" stroke-width="1.5"/>
    <text x="204" y="34" font-family="monospace" font-size="11" font-weight="700" fill="#10B981">02 / LIVE FLEET</text>
    <text x="204" y="76" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#FAFAFA">7,000+</text>
    <text x="204" y="98" font-family="-apple-system, sans-serif" font-size="12" fill="#A1A1AA">Real-Time GPS Agents</text>

    <!-- Stat 3 -->
    <rect x="0" y="132" width="170" height="118" rx="12" fill="#18181C" stroke="#27272A" stroke-width="1.5"/>
    <text x="20" y="166" font-family="monospace" font-size="11" font-weight="700" fill="#38BDF8">03 / RELIABILITY</text>
    <text x="20" y="208" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#FAFAFA">99.9%</text>
    <text x="20" y="230" font-family="-apple-system, sans-serif" font-size="12" fill="#A1A1AA">Production Uptime SLA</text>

    <!-- Stat 4 -->
    <rect x="184" y="132" width="170" height="118" rx="12" fill="#18181C" stroke="#27272A" stroke-width="1.5"/>
    <text x="204" y="166" font-family="monospace" font-size="11" font-weight="700" fill="#A855F7">04 / ECOSYSTEM</text>
    <text x="204" y="208" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#FAFAFA">27+</text>
    <text x="204" y="230" font-family="-apple-system, sans-serif" font-size="12" fill="#A1A1AA">Packages &amp; Systems</text>
  </g>
</svg>
