<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <rect width="1200" height="260" rx="16" fill="#0C0C0E" stroke="#27272A" stroke-width="2"/>

  <text x="40" y="38" font-family="monospace" font-size="12" font-weight="700" fill="#F59E0B" letter-spacing="1.5">ARCHITECTURAL STACK &amp; CORE COMPETENCIES</text>
  <text x="1160" y="38" text-anchor="end" font-family="monospace" font-size="12" fill="#71717A">PRODUCTION-PROVEN INFRASTRUCTURE</text>
  <line x1="40" y1="52" x2="1160" y2="52" stroke="#27272A" stroke-width="1"/>

  <!-- Pillar 1 -->
  <g transform="translate(40, 72)">
    <rect width="265" height="156" rx="12" fill="#141418" stroke="#27272A" stroke-width="1.5"/>
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FAFAFA">⚙️ Back-End &amp; Core</text>
    <text x="20" y="58" font-family="monospace" font-size="12" fill="#10B981">PHP 8.x • Laravel 10/11</text>
    <text x="20" y="80" font-family="monospace" font-size="12" fill="#A1A1AA">ASP.NET Core • C# • Blazor</text>
    <text x="20" y="102" font-family="monospace" font-size="12" fill="#A1A1AA">Node.js • NestJS • Express</text>
    <text x="20" y="124" font-family="monospace" font-size="12" fill="#A1A1AA">Python • REST &amp; GraphQL APIs</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(325, 72)">
    <rect width="265" height="156" rx="12" fill="#141418" stroke="#27272A" stroke-width="1.5"/>
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FAFAFA">🏛️ System Architecture</text>
    <text x="20" y="58" font-family="monospace" font-size="12" fill="#F59E0B">Multi-Tenant SaaS (DB Isolation)</text>
    <text x="20" y="80" font-family="monospace" font-size="12" fill="#A1A1AA">Modular Monolith &amp; DDD</text>
    <text x="20" y="102" font-family="monospace" font-size="12" fill="#A1A1AA">Redis Streams &amp; Event Queues</text>
    <text x="20" y="124" font-family="monospace" font-size="12" fill="#A1A1AA">Laravel Reverb &amp; WebSockets</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(610, 72)">
    <rect width="265" height="156" rx="12" fill="#141418" stroke="#27272A" stroke-width="1.5"/>
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FAFAFA">🗄️ Data, Cloud &amp; DevOps</text>
    <text x="20" y="58" font-family="monospace" font-size="12" fill="#38BDF8">MySQL • PostgreSQL • SQL Server</text>
    <text x="20" y="80" font-family="monospace" font-size="12" fill="#A1A1AA">Redis • Elasticsearch • MongoDB</text>
    <text x="20" y="102" font-family="monospace" font-size="12" fill="#A1A1AA">Docker • AWS • CI/CD Pipelines</text>
    <text x="20" y="124" font-family="monospace" font-size="12" fill="#A1A1AA">ZATCA Phase 2 • AlinmaPay SDK</text>
  </g>

  <!-- Pillar 4 -->
  <g transform="translate(895, 72)">
    <rect width="265" height="156" rx="12" fill="#141418" stroke="#27272A" stroke-width="1.5"/>
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FAFAFA">🖥️ Front-End, Mobile &amp; AI</text>
    <text x="20" y="58" font-family="monospace" font-size="12" fill="#A855F7">TypeScript • React • Next.js</text>
    <text x="20" y="80" font-family="monospace" font-size="12" fill="#A1A1AA">Vue.js • Livewire • Tailwind CSS</text>
    <text x="20" y="102" font-family="monospace" font-size="12" fill="#A1A1AA">Flutter &amp; Dart Cross-Platform</text>
    <text x="20" y="124" font-family="monospace" font-size="12" fill="#A1A1AA">Google Gemini AI Multimodal SDK</text>
